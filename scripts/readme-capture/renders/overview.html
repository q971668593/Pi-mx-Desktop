<!doctype html>
<!-- Feature overview bento. Images are crops of real app screenshots; text comes from window.__DATA__. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<script src="data.js"></script>
<style>
  body { width: 1280px; height: 1660px; position: relative; overflow: hidden; }
  main { position: relative; padding: 52px 52px 0; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: #12131a; display: grid; place-items: center; box-shadow: 0 8px 20px #1a1d2c33; }
  .logo img { width: 30px; height: 30px; object-fit: contain; }
  header .name { font-weight: 700; font-size: 23px; letter-spacing: -.3px; }
  header .name small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 3px; }
  header .meta { margin-left: auto; font: 14px/1 var(--mono); color: var(--muted); text-align: right; }
  header .meta b { display: block; color: var(--brand); font-weight: 600; margin-bottom: 6px; }
  .bento { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: 300px 300px 300px 300px 196px; gap: 18px; }
  .tile { display: flex; flex-direction: column; padding: 20px 20px 0; overflow: hidden; min-width: 0; }
  .tile h3 { margin: 7px 0 5px; font-size: 20px; line-height: 1.25; letter-spacing: -.2px; }
  .tile p { margin: 0 0 14px; font-size: 14px; line-height: 1.5; color: var(--muted); }
  .media { flex: 1; min-height: 0; border-radius: 12px 12px 0 0; border: 1px solid var(--line); border-bottom: 0; overflow: hidden; background: var(--card-2); position: relative; }
  .media img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
  .span3 { grid-column: span 3; } .span2 { grid-column: span 2; } .span6 { grid-column: span 6; }
  .tall { grid-row: span 2; }
  .tall .media img { object-position: left top; }
  .split { flex: 1; position: relative; border-radius: 12px 12px 0 0; overflow: hidden; border: 1px solid var(--line); border-bottom: 0; }
  .split img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
  .split .dark { clip-path: polygon(56% 0, 100% 0, 100% 100%, 36% 100%); }
  .split::after { content: ''; position: absolute; inset: 0; background: linear-gradient(104deg, transparent 47.3%, #ffffffdd 47.8%, transparent 48.3%); }
  .split .tagline { position: absolute; z-index: 2; font: 600 12px/1 var(--mono); letter-spacing: .06em; color: #fff; background: #00000055; padding: 5px 9px; border-radius: 999px; backdrop-filter: blur(6px); }
  .split .tagline.l { left: 12px; bottom: 12px; }
  .split .tagline.d { right: 12px; bottom: 12px; }
  .files { font: 13.5px/1.95 var(--mono); color: var(--ink-2); padding: 2px 2px 16px; }
  .files b { color: var(--brand); font-weight: 500; }
  .files span { color: var(--muted); font-family: var(--sans); }
  .wide { flex-direction: row; align-items: center; gap: 26px; padding: 18px 24px; }
  .wide .lead { width: 470px; flex: none; }
  .wide .lead h3 { margin: 7px 0 6px; }
  .wide .lead p { margin: 0; }
  .wide .files { flex: 1; columns: 2; column-gap: 28px; padding: 0; }
  .wide .files div { break-inside: avoid; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<main>
  <header>
    <div class="logo"><img src="icon.png" alt=""></div>
    <div class="name">Pi mx Desktop<small id="sub"></small></div>
    <div class="meta"><b id="version"></b>Windows · macOS · Linux</div>
  </header>
  <section class="bento" id="bento"></section>
</main>
<script>
  const d = window.__DATA__
  const t = d.tiles
  document.documentElement.lang = d.lang
  document.getElementById('version').textContent = d.version
  document.getElementById('sub').textContent = d.lang === 'zh' ? '把 Pi 的终端 Agent 搬进桌面工作台' : 'The desktop workbench for the Pi terminal agent'
  const head = (x) => `<div class="eyebrow">${x.eyebrow}</div><h3>${x.title}</h3><p>${x.desc}</p>`
  document.getElementById('bento').innerHTML = `
    <article class="card tile span3 tall">${head(t.timeline)}<div class="media"><img src="${t.timeline.img}"></div></article>
    <article class="card tile span3">${head(t.review)}<div class="media"><img src="${t.review.img}"></div></article>
    <article class="card tile span3">${head(t.team)}<div class="media"><img src="${t.team.img}"></div></article>
    <article class="card tile span3">${head(t.terminal)}<div class="media"><img src="${t.terminal.img}"></div></article>
    <article class="card tile span3">${head(t.files)}<div class="media"><img src="${t.files.img}"></div></article>
    <article class="card tile span2">${head(t.composer)}<div class="media"><img src="${t.composer.img}"></div></article>
    <article class="card tile span2">${head(t.context)}<div class="media"><img src="${t.context.img}"></div></article>
    <article class="card tile span2">${head(t.themes)}<div class="split"><img src="${t.themes.light}"><img class="dark" src="${t.themes.dark}"></div></article>
    <article class="card tile span6 wide"><div class="lead">${head(t.shared)}</div><div class="files">${t.shared.files.map(([f, note]) => `<div><b>${f}</b> <span>${note}</span></div>`).join('')}</div></article>`
</script>
</body>
</html>
